{% extends 'base.html' %}
{% block title %}{{ meeting.title }} — Nexora Meet{% endblock %}
{% block content %}
<div class="room-wrapper">

  <!-- Top Bar -->
  <div class="room-topbar">
    <div class="room-info">
      <div class="room-dot"></div>
      <span class="room-title-bar">{{ meeting.title }}</span>
      <span class="room-id-bar">
        <i class="bi bi-hash"></i>{{ meeting.meeting_id }}
      </span>
      <button id="copyIdBtn" class="room-copy-btn" onclick="copyMeetingId()">
        <i class="bi bi-copy"></i> Copy ID
      </button>
    </div>
    <div class="room-top-actions">
      {% if request.user == meeting.host %}
      <a href="{% url 'end_meeting' meeting.meeting_id %}"
         class="room-end-btn"
         onclick="return confirm('End this meeting for everyone?')">
        <i class="bi bi-stop-circle-fill"></i> End Meeting
      </a>
      {% else %}
      <a href="{% url 'dashboard' %}" class="room-leave-btn">
        <i class="bi bi-box-arrow-left"></i> Leave
      </a>
      {% endif %}
    </div>
  </div>

  <!-- Main Room Layout -->
  <div class="room-body">

    <!-- Video Panel -->
    <div class="video-panel" id="videoPanel">
      <div id="jitsi-container"></div>
    </div>

    <!-- Chat Sidebar -->
    <div class="chat-sidebar" id="chatSidebar">
      <div class="chat-header">
        <span><i class="bi bi-chat-dots-fill"></i> Meeting Chat</span>
        <button class="chat-toggle-btn" id="chatToggle" onclick="toggleChat()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="chat-welcome">
          <i class="bi bi-shield-check"></i>
          Chat is end-to-end in this session
        </div>
      </div>

      <div class="chat-input-area">
        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="Type a message..."
          autocomplete="off"
          onkeydown="if(event.key==='Enter') sendMessage()"
        />
        <button class="chat-send-btn" onclick="sendMessage()">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Floating Chat Toggle (mobile / collapsed) -->
  <button class="float-chat-btn" id="floatChatBtn" onclick="toggleChat()" style="display:none;">
    <i class="bi bi-chat-dots-fill"></i>
    <span class="chat-unread-badge" id="unreadBadge" style="display:none;"></span>
  </button>

</div>



<script src="https://meet.jit.si/external_api.js"></script>

<script>
document.addEventListener("DOMContentLoaded", ()=>{

const api = new JitsiMeetExternalAPI(
"meet.jit.si",
{
roomName:
"NexoraFreeRoom{{meeting.meeting_id}}",

parentNode:
document.querySelector(
"#jitsi-container"
),

width:"100%",
height:"100%",

userInfo:{
displayName:
"{{request.user.username}}"
},

configOverwrite:{

prejoinPageEnabled:false,

startWithAudioMuted:false,

startWithVideoMuted:false,

lobbyMode:false,

enableLobbyChat:false,

requireDisplayName:false,

disableModeratorIndicator:true,

hideLobbyButton:true
},

interfaceConfigOverwrite:{

SHOW_JITSI_WATERMARK:false
}
}
);

api.executeCommand(
"displayName",
"{{request.user.username}}"
);

});
</script>

{% endblock %}
