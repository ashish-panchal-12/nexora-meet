{% extends 'base.html' %}
{% block title %}Sign In — Nexora Meet{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-icon-lg"><i class="bi bi-camera-video-fill"></i></div>
      <h1 class="auth-brand">Nexora Meet</h1>
      <p class="auth-tagline">Connect. Collaborate. Create.</p>
    </div>

    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-sub">Sign in to your workspace</p>

    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="field-group">
        <label class="field-label">Username</label>
        <div class="input-icon-wrap">
          <i class="bi bi-person input-icon"></i>
          {{ form.username }}
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="input-icon-wrap">
          <i class="bi bi-lock input-icon"></i>
          {{ form.password }}
          <button type="button" class="eye-btn" onclick="togglePwd(this)">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary-full">
        <i class="bi bi-arrow-right-circle"></i> Sign In
      </button>
    </form>

    <p class="auth-switch">
      Don't have an account? <a href="{% url 'register' %}">Create one →</a>
    </p>
  </div>
</div>
<script>
function togglePwd(btn) {
  const input = btn.closest('.input-icon-wrap').querySelector('input');
  const icon  = btn.querySelector('i');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>
{% endblock %}
