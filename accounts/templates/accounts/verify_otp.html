{% block content %}
<div class="auth-page">
  <div class="auth-bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-icon-lg">
        <i class="bi bi-shield-check"></i>
      </div>

      <h1 class="auth-brand">Nexora Meet</h1>
    </div>

    <h2 class="auth-title">Email Verification</h2>

    <p class="auth-sub">Enter the OTP sent to your email address.</p>

    <form method="POST" class="auth-form">
      {% csrf_token %}

      <div class="field-group">
        <label class="field-label"> Verification Code </label>

        <div class="input-icon-wrap">
          <i class="bi bi-key input-icon"></i>

          <input
            type="text"
            name="otp"
            maxlength="6"
            required
            class="form-control custom-input"
            placeholder="Enter 6-digit OTP"
          />
        </div>
      </div>

      <button type="submit" class="btn-primary-full">
        <i class="bi bi-check-circle"></i>
        Verify OTP
      </button>
    </form>

    <div class="auth-switch">
      <p id="countdown-text">
        Resend OTP available in <span id="timer">3:00</span>
      </p>

      <a
        href="{% url 'resend_otp' %}"
        id="resend-btn"
        class="btn btn-outline-primary"
        style="display: none"
      >
        <i class="bi bi-arrow-repeat"></i>
        Resend OTP
      </a>
    </div>
  </div>
</div>

<script>
  let timeLeft = 180;

  const timerElement = document.getElementById("timer");

  const countdownText = document.getElementById("countdown-text");

  const resendButton = document.getElementById("resend-btn");

  const countdown = setInterval(() => {
    let minutes = Math.floor(timeLeft / 60);

    let seconds = timeLeft % 60;

    timerElement.textContent = `${minutes}:${seconds
      .toString()
      .padStart(2, "0")}`;

    timeLeft--;

    if (timeLeft < 0) {
      clearInterval(countdown);

      countdownText.style.display = "none";

      resendButton.style.display = "inline-block";
    }
  }, 1000);
</script>

{% endblock %}
