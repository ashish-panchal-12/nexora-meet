{% extends 'base.html' %}

{% block title %}
Reset Password — Nexora Meet
{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="auth-card">

    <div class="auth-logo">
      <div class="brand-icon-lg">
        <i class="bi bi-lock-fill"></i>
      </div>

      <h1 class="auth-brand">
        Nexora Meet
      </h1>

      <p class="auth-tagline">
        Create a new password
      </p>
    </div>

    <h2 class="auth-title">
      Reset Password
    </h2>

    <form method="POST" class="auth-form">

      {% csrf_token %}

      <div class="field-group">
        <label class="field-label">
          New Password
        </label>

        <input
          type="password"
          name="password1"
          class="form-control custom-input"
          required
        >
      </div>

      <div class="field-group">
        <label class="field-label">
          Confirm Password
        </label>

        <input
          type="password"
          name="password2"
          class="form-control custom-input"
          required
        >
      </div>

      <button type="submit" class="btn-primary-full">
        Update Password
      </button>

    </form>

  </div>
</div>
{% endblock %}
